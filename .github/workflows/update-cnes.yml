name: Atualizar dados CNES

on:
  schedule:
    - cron: "15 9 5 * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "automation/update_cnes.py"
      - ".github/workflows/update-cnes.yml"

permissions:
  contents: write

concurrency:
  group: atualizar-cnes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - name: Instalar PySUS
        run: pip install -r automation/requirements.txt
      - name: Consultar CNES e gerar resumo
        run: python automation/update_cnes.py
      - name: Salvar resultado
        run: |
          git config user.name "inovarede-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cnes-lavras.json
          git diff --cached --quiet || git commit -m "Atualiza dados automáticos do CNES"
          git push
